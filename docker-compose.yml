# Cleave — the entire stack. `docker compose up` is the only install step.
# Every value comes from .env (copy .env.example -> .env first).
services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: [.env]
    depends_on:
      neo4j: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - ./data:/data
      # dev only: let the container assume CleaveAudit using your host creds
      - ${HOST_AWS_DIR:-~/.aws}:/root/.aws:ro
    command: uvicorn cleave.api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    profiles: ["frontend"]   # Phase 6 — not built until then
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  neo4j_data:
  postgres_data:

[package]
name = "cleave-desktop"
version = "0.7.2"
description = "Cleave — reachability-ranked attack path analysis for AWS"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.13.1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
